name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Tag existente (ex: v2.9.0) para gerar e publicar a imagem Docker sem rodar uma nova release'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  # Roda em todo push na main. O semantic-release (workflow reutilizável em
  # semantic-release.yml) analisa os commits desde a última tag (Conventional
  # Commits — feat/fix/perf/BREAKING CHANGE) e só publica uma versão nova
  # quando há algo relevante; chore/docs/refactor/test/ci/build não geram
  # release. Quando publica, ele mesmo faz bump do package.json, atualiza o
  # CHANGELOG.md e o badge do README, commita de volta na main e cria a tag
  # vX.Y.Z + a GitHub Release — tudo via o GITHUB_TOKEN do próprio Actions
  # (com permissão normal de push, diferente do sandbox usado pelos agentes
  # para desenvolver).
  release:
    needs: quality
    uses: ./.github/workflows/semantic-release.yml
    with:
      node-version: "22"
      branches: '["main"]'
    secrets: inherit

  docker:
    runs-on: ubuntu-latest
    needs: release
    # Roda após uma release nova de verdade, OU quando disparado manualmente
    # com `docker_tag` preenchido (gera a imagem de uma tag já publicada,
    # sem precisar de um commit feat/fix novo para o semantic-release liberar).
    if: needs.release.outputs.new-release-published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.docker_tag != '')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve tag e versão
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.docker_tag }}" ]; then
            TAG="${{ inputs.docker_tag }}"
          else
            TAG="v${{ needs.release.outputs.new-release-version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io exige o path da imagem em minúsculas; github.repository
      # preserva o casing do owner/repo (ex: Welington98/openmonetis).
      - name: Compute image name and tags
        id: image
        shell: bash
        run: |
          NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${MAJOR_MINOR%.*}"

          {
            echo "tags<<EOF"
            echo "$NAME:$VERSION"
            echo "$NAME:$MAJOR_MINOR"
            echo "$NAME:$MAJOR"
            echo "$NAME:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "${{ steps.build.outputs.digest }}"
