name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: 2.8.0) — deve bater com package.json"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release version
        shell: bash
        run: |
          TAG_VERSION="${{ steps.resolve.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"

          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A versão $TAG_VERSION não segue o formato X.Y.Z."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "A versão $TAG_VERSION não corresponde à versão $PACKAGE_VERSION do package.json."
            exit 1
          fi

          if ! grep -Fq "## [$TAG_VERSION]" CHANGELOG.md; then
            echo "A versão $TAG_VERSION não foi encontrada no CHANGELOG.md."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

  docker:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io exige o path da imagem em minúsculas; github.repository
      # preserva o casing do owner/repo (ex: Welington98/openmonetis).
      - name: Compute image name and tags
        id: image
        shell: bash
        run: |
          NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ needs.quality.outputs.tag }}"
          VERSION="${VERSION#v}"
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${MAJOR_MINOR%.*}"

          {
            echo "tags<<EOF"
            echo "$NAME:$VERSION"
            echo "$NAME:$MAJOR_MINOR"
            echo "$NAME:$MAJOR"
            echo "$NAME:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "${{ steps.build.outputs.digest }}"

  github-release:
    runs-on: ubuntu-latest
    needs: [quality, docker]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${{ needs.quality.outputs.tag }}"
          VERSION="${VERSION#v}"
          NOTES=$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started=1; print }
          ' CHANGELOG.md)

          if [[ -z "$NOTES" ]]; then
            echo "Não foi possível extrair as notas da versão $VERSION."
            exit 1
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.quality.outputs.tag }}
          name: ${{ needs.quality.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
